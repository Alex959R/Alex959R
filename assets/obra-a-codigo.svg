<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="880" height="200" role="img" aria-labelledby="title desc">
<title id="title">De la obra al código</title>
<desc id="desc">Animación decorativa: se levanta un muro de ladrillos y luego se escribe código backend con sus pruebas.</desc>
<defs>
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#16243a" stroke-width="1"/></pattern>
  <linearGradient id="flow" x1="0" x2="1"><stop stop-color="#f59e0b"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
</defs>
<style>
.bg{fill:#0b1320}.frame{fill:none;stroke:#24344d}
.brick{fill:#f59e0b;stroke:#b45309;stroke-width:1}
.ground{stroke:#475569;stroke-width:2}
.crane{fill:none;stroke:#64748b;stroke-width:2}
.hook{stroke:#94a3b8;stroke-width:1.5;animation:swing 3s ease-in-out infinite;transform-origin:248px 34px}
.lbl{fill:#e2e8f0;font:600 15px ui-monospace,Consolas,monospace}
.sub{fill:#94a3b8;font:12px ui-monospace,Consolas,monospace}
.code{fill:#cbd5e1;font:13px ui-monospace,Consolas,monospace}
.k{fill:#f59e0b}.t{fill:#38bdf8}.f{fill:#a78bfa}.n{fill:#34d399}
.ok{fill:#34d399;font:600 13px ui-monospace,Consolas,monospace}
.panel{fill:#0f1b2d;stroke:#24344d}
.wire{fill:none;stroke:#24344d;stroke-width:2}
.pulse{fill:none;stroke:url(#flow);stroke-width:3;stroke-linecap:round;stroke-dasharray:14 106;animation:go 2.4s linear infinite}
.cursor{fill:#38bdf8;animation:blink 1.2s steps(2,end) infinite}
@keyframes go{to{stroke-dashoffset:-120}}
@keyframes blink{50%{opacity:0}}
@keyframes swing{50%{transform:rotate(4deg)}}
@keyframes b0{0%,2.0%{opacity:0;transform:translateY(-6px)}5.0%,88%{opacity:1;transform:translateY(0)}96%,100%{opacity:0}}@keyframes b1{0%,3.7%{opacity:0;transform:translateY(-6px)}6.7%,88%{opacity:1;transform:translateY(0)}96%,100%{opacity:0}}@keyframes b2{0%,5.4%{opacity:0;transform:translateY(-6px)}8.4%,88%{opacity:1;transform:translateY(0)}96%,100%{opacity:0}}@keyframes b3{0%,7.1%{opacity:0;transform:translateY(-6px)}10.1%,88%{opacity:1;transform:translateY(0)}96%,100%{opacity:0}}@keyframes b4{0%,8.8%{opacity:0;transform:translateY(-6px)}11.8%,88%{opacity:1;transform:translateY(0)}96%,100%{opacity:0}}@keyframes b5{0%,10.5%{opacity:0;transform:translateY(-6px)}13.5%,88%{opacity:1;transform:translateY(0)}96%,100%{opacity:0}}@keyframes b6{0%,12.2%{opacity:0;transform:translateY(-6px)}15.2%,88%{opacity:1;transform:translateY(0)}96%,100%{opacity:0}}@keyframes b7{0%,13.9%{opacity:0;transform:translateY(-6px)}16.9%,88%{opacity:1;transform:translateY(0)}96%,100%{opacity:0}}@keyframes b8{0%,15.6%{opacity:0;transform:translateY(-6px)}18.6%,88%{opacity:1;transform:translateY(0)}96%,100%{opacity:0}}@keyframes b9{0%,17.3%{opacity:0;transform:translateY(-6px)}20.3%,88%{opacity:1;transform:translateY(0)}96%,100%{opacity:0}}@keyframes b10{0%,19.0%{opacity:0;transform:translateY(-6px)}22.0%,88%{opacity:1;transform:translateY(0)}96%,100%{opacity:0}}@keyframes b11{0%,20.7%{opacity:0;transform:translateY(-6px)}23.7%,88%{opacity:1;transform:translateY(0)}96%,100%{opacity:0}}@keyframes b12{0%,22.4%{opacity:0;transform:translateY(-6px)}25.4%,88%{opacity:1;transform:translateY(0)}96%,100%{opacity:0}}@keyframes b13{0%,24.1%{opacity:0;transform:translateY(-6px)}27.1%,88%{opacity:1;transform:translateY(0)}96%,100%{opacity:0}}@keyframes b14{0%,25.8%{opacity:0;transform:translateY(-6px)}28.8%,88%{opacity:1;transform:translateY(0)}96%,100%{opacity:0}}@keyframes b15{0%,27.5%{opacity:0;transform:translateY(-6px)}30.5%,88%{opacity:1;transform:translateY(0)}96%,100%{opacity:0}}@keyframes b16{0%,29.2%{opacity:0;transform:translateY(-6px)}32.2%,88%{opacity:1;transform:translateY(0)}96%,100%{opacity:0}}@keyframes b17{0%,30.9%{opacity:0;transform:translateY(-6px)}33.9%,88%{opacity:1;transform:translateY(0)}96%,100%{opacity:0}}@keyframes b18{0%,32.6%{opacity:0;transform:translateY(-6px)}35.6%,88%{opacity:1;transform:translateY(0)}96%,100%{opacity:0}}@keyframes b19{0%,34.3%{opacity:0;transform:translateY(-6px)}37.3%,88%{opacity:1;transform:translateY(0)}96%,100%{opacity:0}}@keyframes b20{0%,36.0%{opacity:0;transform:translateY(-6px)}39.0%,88%{opacity:1;transform:translateY(0)}96%,100%{opacity:0}}@keyframes c0{0%,41.7%{opacity:0;transform:translateY(-6px)}44.7%,88%{opacity:1;transform:translateY(0)}96%,100%{opacity:0}}@keyframes c1{0%,46.2%{opacity:0;transform:translateY(-6px)}49.2%,88%{opacity:1;transform:translateY(0)}96%,100%{opacity:0}}@keyframes c2{0%,50.7%{opacity:0;transform:translateY(-6px)}53.7%,88%{opacity:1;transform:translateY(0)}96%,100%{opacity:0}}@keyframes c4{0%,59.7%{opacity:0;transform:translateY(-6px)}62.7%,88%{opacity:1;transform:translateY(0)}96%,100%{opacity:0}}@keyframes c5{0%,64.2%{opacity:0;transform:translateY(-6px)}67.2%,88%{opacity:1;transform:translateY(0)}96%,100%{opacity:0}}@keyframes ok{0%,68.7%{opacity:0;transform:translateY(-6px)}71.7%,88%{opacity:1;transform:translateY(0)}96%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}
</style>
<rect class="bg" width="880" height="200" rx="18"/>
<rect width="880" height="200" rx="18" fill="url(#grid)"/>
<rect class="frame" x="0.5" y="0.5" width="879" height="199" rx="18"/>

