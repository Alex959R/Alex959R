<text class="lbl" x="770" y="43">CÓDIGO</text>
<text class="code" x="500" y="62" style="animation:c0 9s ease-out infinite"><tspan class="k">class</tspan> <tspan class="t">Liquidacion</tspan>(models.Model):</text><text class="code" x="524" y="82" style="animation:c1 9s ease-out infinite">mecanico = models.ForeignKey(Mecanico)</text><text class="code" x="524" y="102" style="animation:c2 9s ease-out infinite">total = models.DecimalField()</text><text class="code" x="500" y="142" style="animation:c4 9s ease-out infinite"><tspan class="k">def</tspan> <tspan class="f">test_liquidacion_diaria</tspan>(self):</text><text class="code" x="524" y="162" style="animation:c5 9s ease-out infinite"><tspan class="k">assert</tspan> res.status_code == <tspan class="n">201</tspan></text><text class="ok" x="500" y="190" style="animation:ok 9s ease-out infinite">✓ 6 pruebas pasaron</text>
